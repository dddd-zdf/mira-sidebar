<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="strip.css">
</head>
<body>
  <nav id="tabs" aria-label="Mira Sidebar"><span id="brand">Mira</span><span id="status">Loading ChatGPT...</span><button id="reload" title="Reload ChatGPT" aria-label="Reload ChatGPT">↻</button><button id="menu" title="Mira menu" aria-label="Mira menu">☰</button><button id="hide" title="Hide sidebar" aria-label="Hide sidebar">×</button></nav>
  <form id="findbar" hidden role="search"><input id="find-query" aria-label="Find in page" placeholder="Find in page" maxlength="2000" autocomplete="off"><span id="find-count" role="status"></span><button type="button" id="find-previous" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button><button type="submit" title="Next (Enter)" aria-label="Next match">↓</button><button type="button" id="find-close" title="Close (Escape)" aria-label="Close search">×</button></form>
  <script src="strip.js"></script>
</body>
</html>
